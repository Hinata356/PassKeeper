<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PassKeeper</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/card.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">PassKeeper</div>
        <!-- Settings Icon Button -->
        <button id="settings-btn" class="settings-icon-btn">
            <svg class="settings-icon" viewBox="0 0 24 24">
                <path
                    d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zm8.3-3.2c0-.4 0-.8-.1-1.1l2.1-1.6c.2-.2.3-.5.2-.8l-2-3.5c-.1-.3-.5-.4-.8-.3l-2.5 1c-.6-.5-1.2-.9-1.9-1.2l-.4-2.7c0-.3-.3-.6-.6-.6h-4c-.3 0-.6.2-.6.5l-.4 2.8c-.7.3-1.3.7-1.9 1.2l-2.5-1c-.3-.1-.6 0-.8.3l-2 3.5c-.1.3 0 .6.2.8l2.1 1.6c0 .4-.1.8-.1 1.1s0 .8.1 1.1l-2.1 1.6c-.2.2-.3.5-.2.8l2 3.5c.1.3.5.4.8.3l2.5-1c.6.5 1.2.9 1.9 1.2l.4 2.7c0 .3.3.6.6.6h4c.3 0 .6-.2.6-.5l.4-2.8c.7-.3 1.3-.7 1.9-1.2l2.5 1c.3.1.6 0 .8-.3l2-3.5c.1-.3 0-.6-.2-.8l-2.1-1.6c.1-.3.1-.7.1-1.1z"
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                />
            </svg>
        </button>
    </header>

    <!-- Main -->
    <main class="container">
        <h1 class="main-title">
            あなたの目からパスワードを守ります
        </h1>

        <!-- Main button area -->
        <div class="button-group">
            <button id="create-pass-btn" class="btn btn-pass" type="button">新規パスワードを作成</button>
            <button class="btn btn-game" type="button">ミニゲームで忘れる</button>
        </div>

        <!-- Card -->
        <div class="card-container">
            
            <div class="card empty" id="create-card-btn" role="button" tabindex="0">
                <span>+ 新しいパスワード</span>
            </div>

        </div>
            <div class="card empty-state" id="emptyCard" style="display: none;">
                <div class="empty-content">
                    <span class="empty-icon">+</span>
                    <p>新しいパスワードを追加</p>
                </div>
            </div>

        </div>

        <!-- Modal: Create New Password -->
        <div id="passwordModal" class="modal-overlay hidden">
            <div class="modal-container">
                <h2 class="modal-title">新規パスワードを作成</h2>

                <!-- Name -->
                <label class="modal-label">名前（任意）</label>
                <div class="input-wrapper">
                    <input type="text" id="pwName" class="modal-input" placeholder="例: スクリーンタイム" />
                </div>

                <!-- Manual / Auto Generation -->
                <label class="modal-label">パスワード</label>
                <div class="input-row">
                    <label class="radio-option">
                        <input type="radio" name="pwSelect" value="manual"> 手動
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="pwSelect" value="auto" checked> 生成
                    </label>
                    <div id="autoLength" class="auto-length hidden">
                        <label class="small-label">桁数</label>
                        <input type="number" id="pwLength" value="4" min="1" max="99" class="" />
                    </div>
                </div>

                <!-- Generation Options -->
                <div id="autoOptions" class="auto-options hidden">
                    <div class="option-divider"></div>
                    <div class="input-row wrap">
                        <label class="radio-option"><input type="radio" name="charType" value="num" checked> 数字のみ</label>
                        <label class="radio-option"><input type="radio" name="charType" value="al"> 英字のみ</label>
                        <label class="radio-option"><input type="radio" name="charType" value="alnum"> 英数字</label>
                    </div>

                    <div class="check-container">
                        <div class="input-row wrap">
                            <label class="radio-option"><input type="checkbox" id="lowerCase"> 小文字のみ</label>
                            <label class="radio-option"><input type="checkbox" id="upperCase"> 大文字のみ</label>
                        </div>

                        <div class="input-row wrap">
                            <label class="radio-option"><input type="checkbox" id="includeSymbols"> 記号を含める</label>
                        </div>
                    </div>
                </div>

                <!-- Display field + Reload button -->
                <div class="input-wrapper pw-display-area">
                    <textarea id="pwDisplay" class="modal-input pw-display" placeholder="生成/手動入力"></textarea>
                    <div class="icon-column">
                        <span id="reloadBtn" class="dli-redo icon-btn"></span>
                        <div class="icon-slot">
                            <span id="copyBtn" class="dli-copy icon-btn"></span>
                            <span id="checkIcon" class="dli-check no-hover"></span>
                        </div>
                    </div>
                </div>

                <!-- Hide until -->
                <label class="modal-label">期限</label>
                <div class="limit-datetime-row">
                    <div class="date-box" id="customDateContainer" tabindex="0">
                        <div class="date-display-wrapper">
                            <span class="date-segment" data-type="year">2025</span>
                            <span class="date-sep">/</span>
                            <span class="date-segment" data-type="month">00</span>
                            <span class="date-sep">/</span>
                            <span class="date-segment" data-type="day">00</span>
                            <span class="calendar"></span>
                        </div>
                    </div>
                    <div class="time-box" id="customTimeContainer" tabindex="0">
                        <div class="date-display-wrapper">
                            <span class="date-segment" data-type="hour">00</span>
                            <span class="date-sep">:</span>
                            <span class="date-segment" data-type="minute">00</span>
                            <span class="clock"></span>
                        </div>
                    </div>
                </div>

                <div class="limit-preset-container" data-picker-scope="create">
                    <button class="limit-preset-btn-minus" data-add="-60" type="button">-1時間</button>
                    <button class="limit-preset-btn-plus" data-add="30" type="button">+30分</button>
                    <button class="limit-preset-btn-plus" data-add="60" type="button">+1時間</button>
                    <button class="limit-preset-btn-plus" data-type="today" type="button">今日中</button>
                    <button class="limit-preset-btn-plus" data-type="plus-day" type="button">次の日</button>
                </div>

                <!-- Emergency reveal count -->
                <label class="modal-label">緊急表示の回数</label>
                <div class="input-wrapper">
                    <input type="number" id="emergencyNum" class="modal-input small" min="0" max="100" value="1" />
                </div>

                <!-- Buttons -->
                <div class="button-row">
                    <button id="cancelModal" class="btn-secondary" type="button">キャンセル</button>
                    <button id="saveModal" class="btn-primary" type="button">作成</button>
                </div>
            </div>
        </div>


        <!-- Extend Expiration Modal -->
        <div id="extendLimitModal" class="modal-overlay hidden" aria-hidden="true">
            <div class="modal-container extend-limit-modal" role="dialog" aria-modal="true" aria-labelledby="extendLimitTitle">
                <h2 id="extendLimitTitle" class="modal-title">期限を延長</h2>
                <p class="modal-subtext compact">期限を再設定します</p>

                <label class="modal-label">期限</label>
                <div class="limit-datetime-row">
                    <div class="date-box" id="extendDateContainer" tabindex="0">
                        <div class="date-display-wrapper">
                            <span class="date-segment" data-type="year">2025</span>
                            <span class="date-sep">/</span>
                            <span class="date-segment" data-type="month">00</span>
                            <span class="date-sep">/</span>
                            <span class="date-segment" data-type="day">00</span>
                            <span class="calendar"></span>
                        </div>
                    </div>
                    <div class="time-box" id="extendTimeContainer" tabindex="0">
                        <div class="date-display-wrapper">
                            <span class="date-segment" data-type="hour">00</span>
                            <span class="date-sep">:</span>
                            <span class="date-segment" data-type="minute">00</span>
                            <span class="clock"></span>
                        </div>
                    </div>
                </div>

                <div class="limit-preset-container" data-picker-scope="extend">
                    <button class="limit-preset-btn-minus" data-add="-60" type="button">-1時間</button>
                    <button class="limit-preset-btn-plus" data-add="30" type="button">+30分</button>
                    <button class="limit-preset-btn-plus" data-add="60" type="button">+1時間</button>
                    <button class="limit-preset-btn-plus" data-type="today" type="button">今日中</button>
                    <button class="limit-preset-btn-plus" data-type="plus-day" type="button">次の日</button>
                </div>

                <div class="button-row">
                    <button id="extendLimitCancelBtn" class="btn-secondary" type="button">キャンセル</button>
                    <button id="extendLimitSaveBtn" class="btn-primary" type="button">更新</button>
                </div>
            </div>
        </div>

        <!-- Generic Confirm Modal -->
        <div id="confirmModal" class="modal-overlay hidden" aria-hidden="true">
            <div class="modal-container confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
                <h2 id="confirmModalTitle" class="modal-title">確認</h2>
                <p id="confirmModalText" class="modal-text"></p>
                <p id="confirmModalSubtext" class="modal-subtext hidden"></p>
                <div class="button-row confirm-button-row">
                    <button id="confirmModalCancelBtn" class="btn-secondary" type="button">キャンセル</button>
                    <button id="confirmModalOkBtn" class="btn-primary" type="button">OK</button>
                </div>
            </div>
        </div>

        <!-- Password Preview Modal -->
        <div id="passwordPreviewModal" class="modal-overlay hidden" aria-hidden="true">
            <div class="modal-container preview-modal" role="dialog" aria-modal="true" aria-labelledby="passwordPreviewTitle">
                <h2 id="passwordPreviewTitle" class="modal-title">パスワード</h2>
                <div id="passwordPreviewText" class="preview-password-text"></div>
                <div class="button-row compact">
                    <button id="passwordPreviewCloseBtn" class="btn-secondary" type="button">閉じる</button>
                    <button id="passwordPreviewCopyBtn" class="btn-primary" type="button">コピー</button>
                </div>
            </div>
        </div>

        <!-- Edit Modal -->
        <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <h2>名前を変更</h2>

            <label>名前</label>
            <input type="text" id="edit-name">

            <div class="modal-btn-area">
                <button id="edit-save-btn" class="btn">変更を保存</button>
                <button id="delete-btn" class="btn danger">削除</button>
                <button id="edit-cancel-btn" class="btn">キャンセル</button>
            </div>
        </div>
        </div>

        <div class="button-group delete-all-group">
            <button id="delete-all-btn" class="btn btn-delete-all" type="button">全削除</button>
        </div>

        <div id="noticeArea" class="notice-area" aria-live="polite" aria-atomic="true"></div>


        <button id="scrollTopBtn" class="scroll-top-btn hidden" type="button" aria-label="ページ先頭に戻る">↑</button>

        <script src="js/script.js" defer></script>
    </main>
</body>
</html>
